<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #1a2230;
        --font-display:
          -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: var(--font-display);
      }
      #scene {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
      }
      #cowWrap {
        position: absolute;
        left: 50%;
        bottom: 500px;
        width: 620px;
        height: 430px;
        margin-left: -310px;
      }
      #tagGlow {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 236, 160, 0.85) 0%, rgba(255, 236, 160, 0) 70%);
        opacity: 0;
      }
      #tagLabel {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 26px 30px;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(10, 14, 10, 0.62), rgba(10, 14, 10, 0.42));
        opacity: 0;
      }
      #tagLabel .kicker,
      #tagLabel .headline,
      #tagLabel .id {
        opacity: 0;
      }
      #tagLabel .kicker {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      #tagLabel .headline {
        font-size: 56px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
      }
      #tagLabel .id {
        font-size: 34px;
        font-weight: 700;
        color: #ffdf7a;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.4"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene" class="clip" data-start="0" data-duration="7.4" data-track-index="0" data-layout-allow-overflow data-layout-allow-overlap>
        <div
          id="campo"
          class="clip"
          data-composition-id="campo"
          data-composition-src="compositions/campo.html"
          data-start="0"
          data-duration="7.4"
          data-track-index="0"
          data-width="1080"
          data-height="1920"
        ></div>

        <div id="cowWrap">
          <div
            id="vaca"
            class="clip"
            data-composition-id="vaca"
            data-composition-src="compositions/vaca.html"
            data-start="0"
            data-duration="7.4"
            data-track-index="1"
            data-width="620"
            data-height="430"
          ></div>
        </div>

      </div>

      <div id="overlay" class="clip" data-start="0" data-duration="7.4" data-track-index="2">
        <div id="tagGlow" style="left: 540px; top: 960px; width: 460px; height: 460px; margin-left: -230px; margin-top: -230px"></div>
        <div id="tagLabel" style="left: 90px; top: 1180px">
          <span class="kicker">LA VACA LLEVA UNA</span>
          <span class="headline">Caravana&nbsp;electrónica</span>
          <span class="id">N.&deg; 456&nbsp;789</span>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      gsap.set("#scene", { transformOrigin: "0 0" });

      // La vaca avanza (el ciclo de patas vive en compositions/vaca.html). 0 -> 3.2s.
      tl.fromTo("#cowWrap", { x: -260 }, { x: -40, duration: 3.2, ease: "sine.inOut" }, 0);

      // Camera settles, then punches into the ear tag.
      tl.to("#scene", { x: -2554, y: -4942, scale: 5.2, duration: 1.3, ease: "power2.inOut" }, 3.5);

      // Reveal the caravana.
      tl.fromTo("#tagGlow", { opacity: 0, scale: 0.6 }, { opacity: 0.9, scale: 1, duration: 0.4, ease: "power2.out" }, 4.75);
      tl.fromTo("#tagLabel", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.85);
      tl.fromTo(
        "#tagLabel .kicker",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
        4.95
      );
      tl.fromTo(
        "#tagLabel .headline",
        { opacity: 0, filter: "blur(8px)", y: 10 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "power3.out" },
        5.1
      );
      tl.fromTo(
        "#tagLabel .id",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" },
        5.32
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #vaca {
          position: absolute;
          inset: 0;
          --hide: #a85a32;
          --hide-dark: #8a4524;
          --hide-light: #c97a4a;
          --cream: #faf3e6;
          --tag-yellow: #f3c524;
        }
        #vaca svg { width: 100%; height: 100%; overflow: visible; }
      </style>

      <div id="vaca" data-composition-id="vaca" data-width="620" data-height="430">
        <svg viewBox="0 0 620 430" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="290" cy="404" rx="190" ry="15" fill="rgba(20,30,10,0.22)" />

          <g id="vaca-legBackFar">
            <rect x="150" y="288" width="26" height="112" rx="11" fill="var(--hide-dark)" />
            <rect x="147" y="366" width="32" height="28" rx="7" fill="var(--cream)" />
            <rect x="147" y="388" width="32" height="16" rx="5" fill="#3a241a" />
          </g>
          <g id="vaca-legBackNear">
            <rect x="182" y="288" width="26" height="112" rx="11" fill="var(--hide)" />
            <rect x="179" y="366" width="32" height="28" rx="7" fill="var(--cream)" />
            <rect x="179" y="388" width="32" height="16" rx="5" fill="#2c1b13" />
          </g>
          <g id="vaca-legFrontFar">
            <rect x="372" y="288" width="26" height="112" rx="11" fill="var(--hide-dark)" />
            <rect x="369" y="366" width="32" height="28" rx="7" fill="var(--cream)" />
            <rect x="369" y="388" width="32" height="16" rx="5" fill="#3a241a" />
          </g>
          <g id="vaca-legFrontNear">
            <rect x="404" y="288" width="26" height="112" rx="11" fill="var(--hide)" />
            <rect x="401" y="366" width="32" height="28" rx="7" fill="var(--cream)" />
            <rect x="401" y="388" width="32" height="16" rx="5" fill="#2c1b13" />
          </g>

          <g id="vaca-tail">
            <path d="M 120 180 Q 97 208 92 238 Q 90 256 94 270" stroke="var(--hide-dark)" stroke-width="13" fill="none" stroke-linecap="round" />
            <ellipse cx="95" cy="276" rx="13" ry="16" fill="var(--cream)" />
          </g>

          <g id="vaca-body">
            <rect x="95" y="168" width="365" height="130" rx="38" fill="var(--hide)" />
            <rect x="95" y="168" width="365" height="130" rx="38" fill="url(#vaca-bodyShade)" />
            <rect x="123" y="173" width="300" height="10" rx="5" fill="var(--hide-light)" opacity="0.45" />
            <path d="M 125 266 Q 295 292 425 266 L 425 244 Q 295 270 125 244 Z" fill="var(--cream)" opacity="0.9" />
            <ellipse cx="165" cy="215" rx="20" ry="14" fill="var(--hide-dark)" opacity="0.35" />
            <ellipse cx="355" cy="258" rx="26" ry="16" fill="var(--hide-dark)" opacity="0.3" />

            <g id="vaca-head">
              <path d="M 398 152 Q 398 102 438 90 Q 478 80 510 108 Q 547 138 558 183 Q 564 213 542 231 Q 507 248 474 237 Q 438 229 418 200 Q 398 182 398 152 Z" fill="var(--hide)" />
              <rect x="470" y="70" width="66" height="178" rx="28" fill="var(--cream)" transform="rotate(-39 502 147)" />
              <ellipse cx="552" cy="198" rx="28" ry="26" fill="#e9b8a0" />
              <ellipse cx="562" cy="202" rx="6.5" ry="8.5" fill="#5a3426" />
              <ellipse cx="477" cy="140" rx="8" ry="9.5" fill="#1f140d" />
              <circle cx="480" cy="136" r="2.4" fill="#fff" />
              <g id="vaca-ear">
                <ellipse cx="415" cy="113" rx="34" ry="19" fill="var(--hide)" transform="rotate(-18 415 113)" />
                <ellipse cx="413" cy="113" rx="26" ry="12" fill="#e8a98a" transform="rotate(-18 413 113)" />
                <g id="vaca-earTag">
                  <rect x="392" y="130" width="26" height="30" rx="5" fill="var(--tag-yellow)" stroke="#c99a15" stroke-width="2" transform="rotate(-12 405 145)" />
                  <text data-layout-ignore x="405" y="146" text-anchor="middle" font-size="10.5" font-weight="800" fill="#4a3a08" font-family="sans-serif" transform="rotate(-12 405 145)">456</text>
                  <text data-layout-ignore x="405" y="157" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4a3a08" font-family="sans-serif" transform="rotate(-12 405 145)">789</text>
                </g>
              </g>
            </g>
          </g>

          <defs>
            <linearGradient id="vaca-bodyShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#000" stop-opacity="0" />
              <stop offset="100%" stop-color="#000" stop-opacity="0.18" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <script>
        // Ciclo de caminata de la vaca: patas, rebote del cuerpo y cola. ~3.2s (finito).
        const tl = gsap.timeline({ paused: true });
        gsap.set(["#vaca-legBackFar", "#vaca-legBackNear", "#vaca-legFrontFar", "#vaca-legFrontNear"], { transformOrigin: "50% 0%" });
        gsap.set("#vaca-tail", { transformOrigin: "120px 180px" });
        gsap.set("#vaca-body", { transformOrigin: "50% 100%" });

        tl.fromTo(["#vaca-legBackFar", "#vaca-legFrontNear"], { rotation: 16 }, { rotation: -16, duration: 0.32, repeat: 9, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo(["#vaca-legBackNear", "#vaca-legFrontFar"], { rotation: -16 }, { rotation: 16, duration: 0.32, repeat: 9, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo("#vaca-body", { y: 0 }, { y: -12, duration: 0.16, repeat: 19, yoyo: true, ease: "sine.inOut" }, 0);
        tl.fromTo("#vaca-tail", { rotation: -10 }, { rotation: 10, duration: 0.4, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0);

        window.__timelines["vaca"] = tl;
      </script>
    </template>
  </body>
</html>

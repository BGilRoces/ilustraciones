<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #campo {
          position: absolute;
          inset: 0;
          overflow: hidden;
          --sky-top: #2f6fb0;
          --sky-bottom: #aed6f1;
          --grass-top: #6fbf4f;
          --grass-bottom: #3f8f2f;
        }
        #campo .sky { position: absolute; inset: 0; background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 72%); }
        #campo .sun {
          position: absolute; left: 690px; top: 360px; width: 420px; height: 420px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 250, 220, 0.95) 0%, rgba(255, 250, 220, 0.35) 45%, rgba(255, 250, 220, 0) 70%);
          filter: blur(2px);
        }
        #campo .cloud { position: absolute; }
        #campo .cloud span { position: absolute; background: #fff; border-radius: 50%; opacity: 0.92; }
        #campo .hills {
          position: absolute; left: -100px; top: 1230px; width: 1280px; height: 260px;
          background: linear-gradient(to bottom, #6fa06a, #5c8f55);
          border-radius: 50% 50% 0 0 / 100% 100% 0 0; opacity: 0.55;
        }
        #campo .ground { position: absolute; left: 0; top: 1360px; width: 1080px; height: 560px; background: linear-gradient(to bottom, var(--grass-top) 0%, var(--grass-bottom) 100%); }
        #campo .ground-shade { position: absolute; left: 0; top: 1360px; width: 1080px; height: 60px; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0)); }
      </style>

      <div id="campo" data-composition-id="campo" data-width="1080" data-height="1920">
        <div class="sky"></div>
        <div class="sun"></div>

          <span style="width: 110px; height: 80px; left: 90px; top: -10px"></span>
          <span style="width: 120px; height: 70px; left: 170px; top: 12px"></span>
        </div>
        <div class="cloud" style="left: 560px; top: 180px; width: 320px; height: 100px">
          <span style="width: 160px; height: 100px; left: 0; top: 6px"></span>
          <span style="width: 130px; height: 90px; left: 110px; top: -16px"></span>
          <span style="width: 140px; height: 80px; left: 210px; top: 14px"></span>

          <span style="width: 100px; height: 64px; left: 0; top: 6px"></span>
          <span style="width: 90px; height: 56px; left: 70px; top: -8px"></span>
        </div>
        <div class="hills"></div>
        <div class="ground"></div>
        <div class="ground-shade"></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        window.__timelines["campo"] = tl;
      </script>

</html>
